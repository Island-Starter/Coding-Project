<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>Accessible Form UI</title>
</head>
<body>

    <h1> Accessible Form UI</h1>
    
    <form action="php.index" method="post">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" placeholder="Enter your full name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" placeholder="xxxxxxxxx" id="password" name="password" required><br><br>
        <i class="fa fa-eye" id="togglePassword" style="cursor: pointer;"></i>
        
        <label for="password">Confirm Password:</label><br>
        <input type="password" placeholder="xxxxxxxxx" id="confirm-password" name="confirm_password" required>
        <i class="fa fa-eye" id="togglePassword" style="cursor: pointer;"></i><br><br>

        <input type="submit" id="submit" value="Update Profile">


    </form>
</body>
</html>
